<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% elsif page.name %}{{ page.name | replace: '-', ' ' | replace: '.html', '' | replace: '.md', '' }}{% else %}slop{% endif %}</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #767676;
      --subtle: #f0f0f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #e8e8e8;
        --muted: #888888;
        --subtle: #1e1e1e;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      line-height: 1.75;
      margin: 0;
      padding: 4rem 1.5rem;
    }
    article {
      max-width: 68ch;
      margin: 0 auto;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.3;
      margin: 2.2rem 0 0.6rem;
    }
    h1 { font-size: 1.75rem; margin-top: 0; }
    h2 { font-size: 1.3rem; }
    h3 { font-size: 1.05rem; }
    p { margin: 0 0 1rem; }
    a { color: var(--fg); }
    a:hover { color: var(--muted); }
    ul, ol { padding-left: 1.4rem; margin: 0 0 1rem; }
    li { margin-bottom: 0.2rem; }
    blockquote {
      margin: 1rem 0;
      padding-left: 1rem;
      border-left: 2px solid var(--muted);
      color: var(--muted);
    }
    code {
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.875em;
      background: var(--subtle);
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }
    pre {
      background: var(--subtle);
      padding: 1rem 1.2rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0 0 1rem;
    }
    pre code {
      background: none;
      padding: 0;
      font-size: 0.9em;
    }
    .scroll-x {
      overflow-x: auto;
      margin: 0 0 1rem;
    }
    table {
      border-collapse: collapse;
      min-width: max-content;
      font-size: 0.82em;
      line-height: 1.45;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    th, td { border: 1px solid var(--subtle); padding: 0.35rem 0.65rem; text-align: left; }
    th { background: var(--subtle); font-weight: 600; }
    img { max-width: 100%; height: auto; }
    hr { border: none; border-top: 1px solid var(--subtle); margin: 2.5rem 0; }
    .mermaid {
      margin: 1rem calc(-1.5rem + 3px);
      background: #ffffff;
      border: 1px solid #111111;
      border-radius: 10px;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <article>
    {{ content }}
  </article>
  <script>
    document.querySelectorAll('article table').forEach(function(t) {
      var wrap = document.createElement('div');
      wrap.className = 'scroll-x';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    document.querySelectorAll('code.language-mermaid').forEach(function(el) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.parentElement.replaceWith(div);
    });
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
  </script>
</body>
</html>
